name: Windows source build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile application and tools
        shell: powershell
        run: .\build.ps1
      - name: Verify editor and graph execution
        shell: powershell
        run: |
          & "$env:JAVA_HOME/bin/java.exe" '-Djava.awt.headless=true' -jar workflow-ui-v0.16.1.jar --verify work/ci-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" '-Djava.awt.headless=true' -jar workflow-ui-v0.16.1.jar --test-graph-native work/ci-graph
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" '-Djava.awt.headless=true' -jar workflow-ui-v0.16.1.jar --test-batch-native work/ci-batch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" '-Djava.awt.headless=true' -jar workflow-ui-v0.16.1.jar --test-subgraphs work/ci-subgraphs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify standalone Java tools
        shell: powershell
        run: |
          python tests/standalone_tools_smoke.py --java "$env:JAVA_HOME/bin/java.exe" --output work/ci-standalone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: |
            development-logs/*-build.log
            work/ci-*/summary.json
          retention-days: 7
